<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GameBoy Live">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a424f" />
      <stop offset="0.55" stop-color="#232830" />
      <stop offset="1" stop-color="#12151a" />
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#cde35c" />
      <stop offset="1" stop-color="#8dab19" />
    </linearGradient>
  </defs>

  <!-- maskable：底色铺满整块，图形收进中心 80% 的安全区 -->
