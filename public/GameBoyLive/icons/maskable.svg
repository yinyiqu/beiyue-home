      <rect x="186" y="152" width="26" height="26" rx="4" />
      <rect x="146" y="192" width="26" height="26" rx="4" />
      <rect x="312" y="248" width="26" height="26" rx="4" />
      <rect x="352" y="248" width="26" height="26" rx="4" />
      <rect x="312" y="208" width="26" height="26" rx="4" />
    </g>
    <circle cx="376" cy="316" r="10" fill="#ff6a5c" />
    <circle cx="376" cy="316" r="20" fill="#ff6a5c" fill-opacity="0.22" />
    <g fill="#2b323d" stroke="#0a0d11" stroke-opacity="0.6" stroke-width="4">
      <rect x="132" y="380" width="88" height="30" rx="8" />
      <rect x="161" y="351" width="30" height="88" rx="8" />
      <circle cx="360" cy="404" r="30" />
