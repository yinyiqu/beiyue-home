name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 用户主页（<user>.github.io）或绑定自有域名 → 不用设 SITE_BASE
      # 项目主页（<user>.github.io/<repo>/）→ 在仓库 Variables 里设 SITE_BASE=/<repo>/
      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}

      # 可选：在仓库 Variables 里设置 CUSTOM_DOMAIN（例如 example.com），构建时写入 CNAME
      - name: Write CNAME
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次部署时自动开启 Pages（之后该参数无副作用）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
